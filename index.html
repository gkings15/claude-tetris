<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-pressed="false">Modo claro</button>
  <div class="app">
  <h1 class="title" aria-label="Tetris">
    <span style="color:#4dd0e1">T</span><span style="color:#e57373">E</span><span style="color:#ffd54f">T</span><span style="color:#81c784">R</span><span style="color:#ba68c8">I</span><span style="color:#ffb74d">S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <ol id="overlay-records" class="records-list" hidden></ol>
        <p id="overlay-stats" class="records-stats" hidden></p>
        <form id="name-form" hidden>
          <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" aria-label="Tu nombre" />
          <button type="submit" id="save-record-btn">Guardar</button>
        </form>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <section id="records" class="records">
    <span class="label">RECORDS</span>
    <ol id="records-list" class="records-list"></ol>
    <p id="records-stats" class="records-stats"></p>
    <button id="reset-records-btn" type="button">Borrar records</button>
  </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
